<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="g3-waiting" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" class="kp-animated-goose"><title>g3-waiting</title><style>
.kp-animated-goose{color:var(--goose-ink,#171717)}
.goose-motion{transform-box:view-box;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-play-state:var(--goose-play-state,running)}
@keyframes goose-stir{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes goose-wave{0%,60%,100%{transform:rotate(0)}15%,40%{transform:rotate(-10deg)}27%{transform:rotate(4deg)}}
@keyframes goose-offer{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
@keyframes goose-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
@keyframes goose-sleep{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.045)}}
@keyframes goose-hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes goose-nod{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
@keyframes goose-talk{0%,40%,80%,100%{transform:rotate(0)}20%,60%{transform:rotate(-2.5deg)}}
@keyframes goose-beak{0%,35%,75%,100%{transform:scaleY(.65)}15%,55%{transform:scaleY(1)}}
@keyframes goose-call{0%,15%,35%,100%{transform:translateY(0)}8%,25%{transform:translateY(-2px)}}
@keyframes goose-sound{0%,38%,100%{opacity:0}7%,30%{opacity:1}}
@keyframes goose-blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}
@media(prefers-reduced-motion:reduce){.goose-motion{animation:none!important}}
</style><path d="M91 158v16l-20 8 9 4h24l9-6-8-7v-15Z" fill="#FF850B" /><path d="M127 158v16l-16 9 9 3h25l9-6-12-7v-15Z" fill="#FF850B" /><g class="goose-motion" style="transform-origin:110px 160px;animation-name:goose-breathe;animation-duration:calc(4.2s * var(--goose-tempo,1))"><path d="M99 105C73 111 65 135 80 154Q91 171 111 162Q132 174 151 156Q170 145 163 128Q153 137 144 115L129 104Z" fill="white" /></g><path d="M128 111L117 97 66 94Q44 98 44 86Q43 70 63 74L119 81Q133 80 140 105Z" fill="white" /><path d="M46 84L27 94H53Z" fill="#FF850B" /><g class="goose-motion" style="transform-origin:58px 83px;animation-name:goose-blink;animation-duration:calc(5.8s * var(--goose-tempo,1))"><circle cx="58" cy="83" r="3.2" fill="#111111" stroke="none" /></g><g transform="translate(130 103)"><path d="M-15-4Q0 2 14-5L5 13Q-5 18-15-4Z" fill="var(--kp-cook-a,#E58A1F)" /><path d="M13-5Q26-17 31-8L18 1 30 13Q18 16 13 1Z" fill="var(--kp-cook-a,#E58A1F)" /><circle cx="14" cy="-3" r="4" fill="var(--kp-cook-a,#E58A1F)" /></g><path d="M20 99h79v10H20Z" fill="#F6DDB0" /><path d="M84 105Q70 117 83 137L88 126Q96 141 99 125L100 112" fill="white" /></svg>