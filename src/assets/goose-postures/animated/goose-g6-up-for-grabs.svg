<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="g6-up-for-grabs" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" class="kp-animated-goose"><title>g6-up-for-grabs</title><style>
.kp-animated-goose{color:var(--goose-ink,#171717)}
.goose-motion{transform-box:view-box;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-play-state:var(--goose-play-state,running)}
@keyframes goose-stir{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes goose-wave{0%,60%,100%{transform:rotate(0)}15%,40%{transform:rotate(-10deg)}27%{transform:rotate(4deg)}}
@keyframes goose-offer{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
@keyframes goose-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
@keyframes goose-sleep{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.045)}}
@keyframes goose-hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes goose-nod{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
@keyframes goose-talk{0%,40%,80%,100%{transform:rotate(0)}20%,60%{transform:rotate(-2.5deg)}}
@keyframes goose-beak{0%,35%,75%,100%{transform:scaleY(.65)}15%,55%{transform:scaleY(1)}}
@keyframes goose-call{0%,15%,35%,100%{transform:translateY(0)}8%,25%{transform:translateY(-2px)}}
@keyframes goose-sound{0%,38%,100%{opacity:0}7%,30%{opacity:1}}
@keyframes goose-blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}
@media(prefers-reduced-motion:reduce){.goose-motion{animation:none!important}}
</style><path d="M91 158v16l-20 8 9 4h24l9-6-8-7v-15Z" fill="#FF850B" /><path d="M127 158v16l-16 9 9 3h25l9-6-12-7v-15Z" fill="#FF850B" /><path d="M99 105C73 111 65 135 80 154Q91 171 111 162Q132 174 151 156Q170 145 163 128Q153 137 144 115L129 104Z" fill="white" /><g class="goose-motion" style="transform-origin:118px 108px;animation-name:goose-nod;animation-duration:calc(3.7s * var(--goose-tempo,1))"><path d="M125 110Q122 61 95 56Q65 49 65 78L71 97 83 93Q82 71 94 79L104 111Z" fill="white" /><path d="M66 82L70 106Q76 112 83 92Z" fill="#FF850B" /><g class="goose-motion" style="transform-origin:77px 72px;animation-name:goose-blink;animation-duration:calc(5.8s * var(--goose-tempo,1))"><circle cx="77" cy="72" r="3.2" fill="#111111" stroke="none" /></g></g><g transform="translate(113 108)"><path d="M-15-4Q0 2 14-5L5 13Q-5 18-15-4Z" fill="var(--kp-cook-a,#E58A1F)" /><path d="M13-5Q26-17 31-8L18 1 30 13Q18 16 13 1Z" fill="var(--kp-cook-a,#E58A1F)" /><circle cx="14" cy="-3" r="4" fill="var(--kp-cook-a,#E58A1F)" /></g><path d="M20 135h70v10H20Z" fill="#F6DDB0" /><path d="M42 128h22l-5 8H36Z" fill="#F6DDB0" /><g class="goose-motion" style="transform-origin:80px 120px;animation-name:goose-hover;animation-duration:calc(2.7s * var(--goose-tempo,1))"><path d="M97 118Q81 107 68 115L58 123Q58 131 67 127L75 122Q81 134 87 127L99 131" fill="white" /></g></svg>