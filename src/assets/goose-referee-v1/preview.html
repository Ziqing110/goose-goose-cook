<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小鹅裁判倒计时</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;color:#1a1a1a;background:white}main{max-width:850px;margin:auto;padding:30px 20px}header{border-bottom:1px solid #ddd;padding-bottom:20px}h1{font-size:26px}p,footer{color:#6e6e6b;font-size:13px}.stage{display:flex;align-items:center;justify-content:center;gap:30px;min-height:430px}.goose{width:256px;height:384px;background:url(referee-sheet.png) 0% 0/400% 100% no-repeat;flex-shrink:0}.beat{width:210px;text-align:center;font-size:120px;font-weight:800}.controls,.frames{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px 0}button,a{padding:12px 17px;background:white;border:1px solid #ddd;border-radius:8px;color:inherit;font:14px system-ui;text-decoration:none;cursor:pointer}#play{background:#d4552a;color:white;border-color:#d4552a}footer{border-top:1px solid #ddd;padding-top:20px;line-height:1.6}@media(max-width:550px){.stage{gap:0;min-height:340px}.goose{width:190px;height:285px}.beat{width:130px;font-size:74px}}</style><main><header><b>Kitchen Path / VERSUS</b></header><h1>小鹅裁判，准备开赛。</h1><p>紫色领巾 · 小哨子 · 3 → 2 → 1 → GO</p><div class="stage"><div class="goose" role="img" aria-label="小鹅裁判"></div><div class="beat" role="status" aria-live="polite">3</div></div><div class="controls"><button id="play">播放倒数</button><button id="pause">暂停</button><a href="referee-countdown.webp" download>下载动画 WebP</a></div><div class="frames"><button data-frame="0">3</button><button data-frame="1">2</button><button data-frame="2">1</button><button data-frame="3">GO</button></div><footer>白底四帧动作动画，无声音；数字由页面叠加。正式开赛可用动作帧与比赛计时同步控制。此预览不会启动比赛。</footer></main><script>let frame=0,timer;function stop(){clearTimeout(timer)}function show(i){frame=i;document.querySelector('.goose').style.backgroundPositionX=(i*100/3)+'%';document.querySelector('.beat').textContent=['3','2','1','GO!'][i]}function tick(){if(frame<3){show(frame+1);timer=setTimeout(tick,1000)}}document.querySelector('#play').onclick=()=>{stop();show(0);timer=setTimeout(tick,1000)};document.querySelector('#pause').onclick=stop;document.querySelectorAll('[data-frame]').forEach(b=>b.onclick=()=>{stop();show(+b.dataset.frame)});</script></html>
