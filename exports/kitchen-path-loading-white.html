}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

#kp-loading-polished{--kp-paper:#ffffff;--kp-ink:#272b26;--kp-muted:#70766e;--kp-soft:#e9e7df;--kp-orange:#b94d2b;--kp-wash:#f3ecdf;--kp-sage:#68795a;color-scheme:light;background:#ffffff;color:var(--kp-ink);font-family:Inter,Arial,sans-serif}
#kp-loading-polished *{box-sizing:border-box}
#kp-loading-polished .kp-window{background:var(--kp-paper);border:1px solid var(--kp-soft);border-radius:18px;overflow:hidden}
#kp-loading-polished .kp-header{display:flex;align-items:center;justify-content:space-between;padding:22px 30px;border-bottom:1px solid var(--kp-soft);gap:20px}
#kp-loading-polished .kp-brand{display:flex;gap:11px;align-items:center;color:var(--kp-ink);text-decoration:none;font-size:17px;font-weight:600;letter-spacing:-.5px}
#kp-loading-polished .kp-brand-mark{font-family:Georgia,serif;font-size:29px;letter-spacing:-5px;padding-right:6px;color:var(--kp-orange)}
#kp-loading-polished .kp-brand-mark span{color:var(--kp-ink)}
#kp-loading-polished .kp-brand-note{display:block;font-size:8px;font-weight:500;letter-spacing:1.2px;margin-top:4px;color:var(--kp-muted)}
#kp-loading-polished .kp-session{font-size:9px;letter-spacing:1.5px;color:var(--kp-muted);display:flex;align-items:center;gap:8px}
#kp-loading-polished .kp-session&gt;span{width:5px;height:5px;border-radius:50%;background:var(--kp-sage)}
#kp-loading-polished .kp-journey{display:flex;align-items:center;justify-content:center;gap:14px;padding:25px 20px;font-size:11px}
#kp-loading-polished .kp-journey&gt;span{display:flex;align-items:center;gap:7px;white-space:nowrap}
#kp-loading-polished .kp-journey i{font-style:normal;display:grid;place-items:center;border-radius:50%;width:22px;height:22px;font-size:10px}
#kp-loading-polished .kp-journey b{height:1px;width:32px;background:var(--kp-soft)}
#kp-loading-polished .kp-past{color:var(--kp-sage)}
#kp-loading-polished .kp-past i{background:var(--kp-wash)}
#kp-loading-polished .kp-current{color:var(--kp-orange);font-weight:600}
#kp-loading-polished .kp-current i{background:var(--kp-orange);color:var(--kp-paper)}
#kp-loading-polished .kp-future{color:var(--kp-muted)}
#kp-loading-polished .kp-future i{border:1px solid var(--kp-soft)}
#kp-loading-polished .kp-main{text-align:center;display:flex;flex-direction:column;align-items:center;padding:25px 20px 47px}
#kp-loading-polished .kp-eyebrow{display:flex;align-items:center;gap:8px;color:var(--kp-muted);font-size:9px;letter-spacing:2px;font-weight:500}
#kp-loading-polished .kp-spark{display:inline-block;width:5px;height:5px;background:var(--kp-orange);transform:rotate(45deg)}
#kp-loading-polished .kp-art{position:relative;width:280px;height:278px;margin:17px 0 10px;display:grid;place-items:center}
#kp-loading-polished .kp-halo{position:absolute;width:235px;height:235px;border-radius:50%;background:var(--kp-wash);bottom:13px}
#kp-loading-polished .kp-sprite{position:relative;width:195px;height:260px;overflow:hidden;z-index:1}
#kp-loading-polished .kp-sprite img{display:block;width:400%;height:100%;max-width:none;animation:kp-chef-sort var(--kp-cycle,2.2s) steps(1,end) infinite}
#kp-loading-polished .kp-art-tag{position:absolute;z-index:2;bottom:0;left:50%;transform:translateX(-50%) rotate(-4deg);background:var(--kp-paper);border:1px solid var(--kp-soft);border-radius:5px;padding:7px 11px;font-size:8px;letter-spacing:1.3px;white-space:nowrap;display:flex;align-items:center;gap:6px;color:var(--kp-sage)}
#kp-loading-polished .kp-art-tag&gt;span{display:inline-block;width:5px;height:5px;background:var(--kp-sage);border-radius:50%}
#kp-loading-polished h1{font-family:Georgia,&#x27;Times New Roman&#x27;,serif;font-size:42px;line-height:1.1;letter-spacing:-1.7px;font-weight:400;margin:20px 0 15px}
#kp-loading-polished .kp-description{font-size:13px;line-height:1.8;color:var(--kp-muted);margin:0 0 25px;max-width:390px}
#kp-loading-polished .kp-live{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:500;color:var(--kp-orange)}
#kp-loading-polished .kp-loader{display:flex;align-items:center;gap:3px;height:14px}
#kp-loading-polished .kp-loader i{width:3px;height:9px;border-radius:2px;background:var(--kp-orange);animation:kp-pulse 1.1s ease-in-out infinite}
#kp-loading-polished .kp-loader i:nth-child(2){animation-delay:.15s}
#kp-loading-polished .kp-loader i:nth-child(3){animation-delay:.3s}
#kp-loading-polished .kp-details{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;color:var(--kp-muted);font-size:10px;margin-top:13px}
#kp-loading-polished .kp-details i{font-style:normal}
#kp-loading-polished .kp-footer{padding:20px 30px;display:grid;grid-template-columns:1fr auto;gap:6px;border-top:1px solid var(--kp-soft)}
#kp-loading-polished .kp-footer-label{font-size:8px;letter-spacing:1.6px;color:var(--kp-muted)}
#kp-loading-polished .kp-footer p{grid-column:1;font-family:Georgia,serif;font-style:italic;font-size:13px;margin:0;color:var(--kp-ink)}
#kp-loading-polished .kp-footer-end{grid-column:2;grid-row:1/3;align-self:center;font-size:8px;letter-spacing:1.2px;color:var(--kp-muted)}
@keyframes kp-chef-sort{0%,19%{transform:translateX(0)}25%,44%{transform:translateX(-25%)}50%,74%{transform:translateX(-50%)}80%,100%{transform:translateX(-75%)}}
@keyframes kp-pulse{0%,100%{transform:scaleY(.45);opacity:.5}50%{transform:scaleY(1);opacity:1}}
#kp-loading-polished.is-paused img,#kp-loading-polished.is-paused .kp-loader i{animation-play-state:paused}
@media(max-width:520px){#kp-loading-polished .kp-header{padding:18px}#kp-loading-polished .kp-session{display:none}#kp-loading-polished .kp-journey{gap:7px;padding:21px 10px;font-size:10px}#kp-loading-polished .kp-journey b{width:12px}#kp-loading-polished .kp-journey&gt;span{gap:4px}#kp-loading-polished .kp-journey i{width:18px;height:18px}#kp-loading-polished .kp-main{padding-top:18px}#kp-loading-polished h1{font-size:37px}#kp-loading-polished .kp-footer{padding:20px}#kp-loading-polished .kp-footer-end{display:none}#kp-loading-polished .kp-desktop-break{display:none}}
@media(prefers-reduced-motion:reduce){#kp-loading-polished .kp-sprite img,#kp-loading-polished .kp-loader i{animation:none}}

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
